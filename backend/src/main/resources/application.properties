spring.application.name=backend

# All connection settings can be overridden by environment variables.
# The defaults match database/database_setup.sql for local development.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/progressgrid_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:pg_user}
spring.datasource.password=${DB_PASSWORD:password123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT. Leave JWT_SECRET unset locally and a random key is generated at startup
# (tokens then stop working when the process restarts). Always set it in production.
app.jwtSecret=${JWT_SECRET:}
app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}
