# ProgressGrid - Development Profile (In-Memory H2 Database)
# Use this profile to run the backend without needing a local MySQL server installed:
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev

spring.datasource.url=jdbc:h2:mem:progressgrid_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Stable dev JWT secret
app.jwt.secret=ProgressGridSuperSecretDevelopmentKey1234567890!
app.jwt.expiration-ms=86400000
